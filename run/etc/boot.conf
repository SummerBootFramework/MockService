#####################################################
# 5.1 Security Settings: keystore type and provider #
#####################################################
# Note: keystore type for SSL/TLS, valid values: PKCS12 (default), PKCS11, JCEKS , JKS, BCFKS
#keystore.type=PKCS12

# Note: keystore provider for SSL/TLS, valid values: null=JDK default, BC (BouncyCastle), SunJSSE, BCFIPS, etc.
# Note: BC will not verify the key password, so it is not recommended for production use.
# Note: BCFIPS is a FIPS compliant provider, which is required by some government applications.
#keystore.provider=


#########################################
# 5.2 Security Settings: message digest #
#########################################
# Note: SHA3-224, SHA3-256 (default), SHA3-384, SHA3-512, SHA-256, SHA-384, SHA-512, etc. 
# Note: MD5 and SHA-1 is a broken or risky cryptographic algorithm, see https://en.wikipedia.org/wiki/SHA-3 (section Comparison of SHA functions)
#algorithm.Messagedigest=SHA3-256


###################################################################
# 5.3 Security Settings: asymmetric key (public/private key pair) #
###################################################################
# Note: Asymmetric key algorithm, valid values: RSA (default), DSA, EC, DiffieHellman, Ed25519, Ed448, etc.
#algorithm.Asymmetric=RSA

# Note: Asymmetric cipher transformation, valid values: RSA/None/OAEPWithSHA-256AndMGF1Padding (default), RSA/ECB/PKCS1Padding, RSA/ECB/OAEPWithSHA-1AndMGF1Padding, RSA/ECB/OAEPWithSHA-256AndMGF1Padding, DSA/None/PKCS1Padding, EC/None/PKCS1Padding, etc. 
# Note: ryptographic algorithm ECB is weak and should not be used： RSA/ECB/PKCS1Padding
#transformation.Asymmetric=RSA/None/OAEPWithSHA-256AndMGF1Padding


######################################################
# 5.4 Security Settings: symmetric key (no password) #
######################################################
# Note: Symmetric key algorithm, valid values: AES (default), DES, DESede, Blowfish, ARCFOUR, ChaCha20, HmacMD5, HmacSHA1, HmacSHA224, HmacSHA256, HmacSHA384, HmacSHA512, HmacSHA512/224, HmacSHA512/256, HmacSHA3-224, HmacSHA3-256, HmacSHA3-384, HmacSHA3-512, RC2, etc.
#algorithm.Symmetric=AES

# Note: key size in bits for symmetric key generation, algorithms may have different key size requirements.
#length.SymmetricKey.Bits=256

# Note: Symmetric cipher transformation, valid values: AES/GCM/NoPadding (default, for modern applications), AES/CBC/PKCS5Padding (more compatible with older systems), AES/CBC/NoPadding, AES/CTR/NoPadding, AES/CFB/NoPadding, DES/CBC/PKCS5Padding, DESede/CBC/PKCS5Padding, Blowfish/CBC/PKCS5Padding, etc.
# Note: do not use AES/CBC, and AES/GCM/PKCS5Padding is no longer supported in Java17 - https://docs.oracle.com/en/java/javase/17/docs/api/java.base/javax/crypto/Cipher.html
#transformation.Symmetric=AES/GCM/NoPadding

# Note: AuthenticationTag size in bits for symmetric key generation, algorithms may have different AuthenticationTag size requirements.
#length.SymmetricKey.AuthenticationTag.Bits=128

# Note: IV size in bits for symmetric key generation, algorithms may have different IV size requirements.
#length.symmetricKey.InitializationVector.Bytes=12


#####################################################
# 5.5 Security Settings: secret key (with password) #
#####################################################
# Note: Symmetric key factory generation algorithm, valid values: PBKDF2WithHmacSHA256 (default), PBKDF2WithHmacSHA512, PBKDF2WithHmacSHA1, etc.
#algorithm.SecretKey=PBKDF2WithHmacSHA256

# Note: key size in bits for symmetric key generation, algorithms may have different key size requirements.
#length.algorithm.SecretKey.Bits=256

# Note: salt size in bytes for symmetric key generation, algorithms may have different salt size requirements.
#length.algorithm.SecretKey.Salt.Bits=16

# Note: for symmetric key generation, algorithms may have different iteration requirements.
#count.algorithm.SecretKey.iteration=310000
