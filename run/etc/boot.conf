# Note: available values: system, Linux, Windows
#default.lineSeparator=system
#default.ConfigChangeMonitor.Throttle.Milliseconds=100
#default.web.resource.ttl.sec=3600
#reflection.package.level=2
#timeout.alert.milliseconds=10000
#cache.ping.ttl.milliseconds=1000
#cache.ping.verify.milliseconds=2500
#timeout.alert.message=Note: This is a known issue in Linux systems where the/dev/random runs out of "entropy" and it causes the system to blockthreads. \n	To verify: cat /dev/random or install rng-tools and/or haveged.\n	Or add a JVM argument to the runner: -Djava.security.egd=file:/dev/./urandom
#portinuse.alert.message=In order to check which application is listening on a port, you can use the following command from the command line:\n\nFor Microsoft Windows:\n    netstat -ano | find "80" | find "LISTEN"\n    tasklist /fi "PID eq <pid>"\n     \nFor Linux:\n    netstat -anpe | grep "80" | grep "LISTEN" \n

# Note: valid value = VirtualThread (default for Java 21+), CPU, IO and Mixed (default for old Java) 
